<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio - Lanchonete IFTO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="logo-area">
      <img src="imagens/logo.png" alt="Logo IFTO">
      <span>Lanchonete IFTO</span>
    </div>
    <div class="acoes-header">
      <button id="btnCarrinho" class="btn-carrinho">
        Carrinho (<span id="qtdCarrinho">0</span>)
      </button>
      <button id="btnSair" class="btn-sair">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <section class="banner">
      <h2>Cardápio do Dia</h2>
      <p>Faça seu pedido ou reserva para o horário do intervalo.</p>
    </section>

    <nav class="filtros">
      <button class="btn-filtro ativo" data-cat="Todos">Todos</button>
      <button class="btn-filtro" data-cat="Comida">Salgados & Lanches</button>
      <button class="btn-filtro" data-cat="Bebida">Bebidas</button>
      <button class="btn-filtro" data-cat="Doces">Doces</button>
    </nav>

    <section id="listaProdutos" class="grid-produtos"></section>

    <!-- Modal/Painel do Carrinho -->
    <section id="painelCarrinho" class="carrinho-modal escondido">
      <div class="carrinho-conteudo">
        <div class="carrinho-topo">
          <h3>Seu Carrinho</h3>
          <button id="btnFecharCarrinho" class="btn-fechar">X</button>
        </div>

        <div id="itensCarrinho"></div>

        <div class="total-area">
          <span>Total:</span>
          <strong id="valorTotal">R$ 0,00</strong>
        </div>

        <form id="formCheckout" class="checkout-form">
          <label>Opção de Pedido:</label>
          <div class="radio-group">
            <label><input type="radio" name="tipoPedido" value="Compra" checked> Comprar Agora</label>
            <label><input type="radio" name="tipoPedido" value="Reserva"> Reservar</label>
          </div>

          <label for="horarioRetirada">Horário de Retirada:</label>
          <input type="time" id="horarioRetirada" required>

          <div id="campoPagamento">
            <label for="formaPagamento">Forma de Pagamento:</label>
            <select id="formaPagamento">
              <option value="Pix">Pix</option>
              <option value="Dinheiro">Dinheiro</option>
              <option value="Cartão">Cartão de Crédito/Débito</option>
            </select>
          </div>

          <button type="submit" class="btn-principal">Confirmar Pedido</button>
        </form>
      </div>
    </section>
  </main>

  <script src="aluno.js"></script>
</body>
</html>
