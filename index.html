<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Lanchonete IFTO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <img src="imagens/logo.png" alt="Logo IFTO" class="logo-login">
    <h1>Lanchonete IFTO</h1>

    <form id="formLogin">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" placeholder="Digite seu usuário" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>

      <button type="submit" class="btn-principal">Entrar</button>
    </form>

    <div class="dica-login">
      <p><strong>Acesso de teste:</strong></p>
      <p>Aluno: <code>aluno</code> / <code>1234</code></p>
      <p>Admin: <code>admin</code> / <code>admin123</code></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
